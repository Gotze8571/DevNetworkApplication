services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devnetwork}
      POSTGRES_USER: ${POSTGRES_USER:-devnetwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devnetwork}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-devnetwork}
      DB_USERNAME: ${POSTGRES_USER:-devnetwork}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devnetwork}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
